<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أكاديمية السرد - لوحة التحكم</title>
    <style>
        /* الألوان والخلفيات */
        :root {
            --bg-body: #0b1120;
            --bg-card: rgba(30, 41, 59, 0.85);
            --accent-cyan: #22d3ee;
            --accent-green: #4ade80;
            --accent-red: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        /* خلفية شبكية تكنولوجية متحركة ببطء */
        body {
            background-color: var(--bg-body);
            background-image: 
                linear-gradient(rgba(34, 211, 238, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 211, 238, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation; /* منع الزووم المزعج على الموبايل */
            padding: 15px;
            box-sizing: border-box;
        }

        .dashboard {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid rgba(34, 211, 238, 0.15);
            border-radius: 20px;
            padding: 25px 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            text-align: center;
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }

        /* تأثير الإضاءة لما الستوب ووتش يشتغل */
        .card-full { 
            grid-column: 1 / -1; 
        }
        .card-full.running-glow {
            box-shadow: 0 0 25px rgba(74, 222, 128, 0.15);
            border-color: rgba(74, 222, 128, 0.4);
        }
        .card-full.paused-glow {
            box-shadow: 0 0 25px rgba(244, 63, 94, 0.15);
            border-color: rgba(244, 63, 94, 0.4);
        }

        h2 { margin-top: 0; margin-bottom: 20px; color: var(--accent-cyan); font-weight: 600; font-size: 22px; }

        /* ستايل الستوب ووتش */
        .stopwatch-display {
            font-size: clamp(40px, 8vw, 65px);
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: var(--text-main);
            text-shadow: 0 0 15px rgba(34, 211, 238, 0.5);
            direction: ltr;
            margin: 15px 0;
            letter-spacing: 2px;
        }
        
        .ms { font-size: clamp(20px, 4vw, 35px); color: var(--accent-cyan); }

        /* ستايل الأزرار */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        .btn-circle {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 2px solid transparent;
            background-color: rgba(255, 255, 255, 0.03);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-circle span:first-child { font-size: 30px; margin-bottom: 2px; }
        .btn-circle span:last-child { font-size: 11px; font-weight: bold; }

        .play-state {
            border-color: var(--accent-green);
            color: var(--accent-green);
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.2);
        }
        .play-state:active { background-color: rgba(74, 222, 128, 0.2); transform: scale(0.9); }

        .pause-state {
            border-color: var(--accent-red);
            color: var(--accent-red);
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.2);
        }
        .pause-state:active { background-color: rgba(244, 63, 94, 0.2); transform: scale(0.9); }

        .btn-reset { border-color: var(--text-muted); color: var(--text-muted); }
        .btn-reset:active { background-color: rgba(148, 163, 184, 0.2); color: white; transform: scale(0.9); }

        /* ستايل العدادات */
        .counter-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }
        .counter-val { font-size: 45px; font-weight: bold; width: 60px; }
        
        .btn-counter {
            width: 55px;
            height: 55px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            font-size: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-counter:active { background: rgba(34, 211, 238, 0.2); transform: scale(0.85); }
        
        .val-red { color: var(--accent-red); text-shadow: 0 0 15px rgba(244, 63, 94, 0.4); }
        .val-cyan { color: var(--accent-cyan); text-shadow: 0 0 15px rgba(34, 211, 238, 0.4); }

        .hint { margin-top: 20px; color: var(--text-muted); font-size: 12px; }
        .key-badge { background: rgba(255,255,255,0.1); padding: 3px 8px; border-radius: 4px; color: #fff; }

        /* تجاوب الشاشة للموبايل */
        @media (max-width: 600px) {
            .dashboard { grid-template-columns: 1fr; gap: 15px; }
            .card { padding: 20px 10px; }
            .counter-wrap { gap: 40px; } /* توسيع المسافة بين الزراير على الموبايل لسهولة الضغط */
            .btn-counter { width: 65px; height: 65px; font-size: 35px; } /* تكبير زراير العداد للموبايل */
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- كارت الستوب ووتش -->
        <div class="card card-full" id="mainCard">
            <h2>المؤقت الزمني (Stopwatch)</h2>
            
            <div class="stopwatch-display" id="display">
                00:00:00<span class="ms" id="ms">.00</span>
            </div>
            
            <div class="controls">
                <!-- زر مدمج -->
                <button id="mainBtn" class="btn-circle play-state" onclick="toggleStopwatch()">
                    <span id="mainIcon">▶</span>
                    <span id="mainText">بدء</span>
                </button>
                
                <!-- زر التصفير -->
                <button id="resetBtn" class="btn-circle btn-reset" onclick="resetStopwatch()">
                    <span>↻</span>
                    <span>تصفير</span>
                </button>
            </div>
            <p class="hint">💡 اختصارات الكيبورد: <span class="key-badge">Space</span> للتشغيل/الإيقاف | <span class="key-badge">R</span> للتصفير</p>
        </div>

        <!-- كارت الأخطاء -->
        <div class="card">
            <h2>الأخطاء</h2>
            <div class="counter-wrap">
                <button class="btn-counter" onclick="updateCounter('mistakes', -1)">-</button>
                <div class="counter-val val-red" id="mistakes">0</div>
                <button class="btn-counter" onclick="updateCounter('mistakes', 1)">+</button>
            </div>
        </div>

        <!-- كارت التنبيهات -->
        <div class="card">
            <h2>التنبيهات</h2>
            <div class="counter-wrap">
                <button class="btn-counter" onclick="updateCounter('prompts', -1)">-</button>
                <div class="counter-val val-cyan" id="prompts">0</div>
                <button class="btn-counter" onclick="updateCounter('prompts', 1)">+</button>
            </div>
        </div>
    </div>

    <script>
        // === برمجة المؤقت الزمني ===
        let startTime, updatedTime, difference = 0, tInterval;
        let isRunning = false;

        const display = document.getElementById('display');
        const mainBtn = document.getElementById('mainBtn');
        const resetBtn = document.getElementById('resetBtn');
        const mainIcon = document.getElementById('mainIcon');
        const mainText = document.getElementById('mainText');
        const mainCard = document.getElementById('mainCard');

        function toggleStopwatch() {
            animateButton(mainBtn);
            if (!isRunning) {
                // التشغيل
                startTime = new Date().getTime() - difference;
                tInterval = setInterval(updateTime, 10);
                isRunning = true;
                
                mainBtn.classList.remove('play-state');
                mainBtn.classList.add('pause-state');
                mainIcon.innerHTML = '⏸';
                mainText.innerHTML = 'إيقاف';
                
                // تأثير الإضاءة
                mainCard.classList.remove('paused-glow');
                mainCard.classList.add('running-glow');
            } else {
                // الإيقاف
                clearInterval(tInterval);
                isRunning = false;
                
                mainBtn.classList.remove('pause-state');
                mainBtn.classList.add('play-state');
                mainIcon.innerHTML = '▶';
                mainText.innerHTML = 'إكمال';
                
                // تأثير الإضاءة
                mainCard.classList.remove('running-glow');
                mainCard.classList.add('paused-glow');
            }
        }

        function resetStopwatch() {
            animateButton(resetBtn);
            clearInterval(tInterval);
            isRunning = false;
            difference = 0;
            display.innerHTML = '00:00:00<span class="ms">.00</span>';
            
            mainBtn.classList.remove('pause-state');
            mainBtn.classList.add('play-state');
            mainIcon.innerHTML = '▶';
            mainText.innerHTML = 'بدء';
            
            mainCard.classList.remove('running-glow', 'paused-glow');
        }

        function updateTime() {
            updatedTime = new Date().getTime();
            difference = updatedTime - startTime;

            let hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            let minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            let seconds = Math.floor((difference % (1000 * 60)) / 1000);
            let milliseconds = Math.floor((difference % 1000) / 10); 

            hours = (hours < 10) ? "0" + hours : hours;
            minutes = (minutes < 10) ? "0" + minutes : minutes;
            seconds = (seconds < 10) ? "0" + seconds : seconds;
            milliseconds = (milliseconds < 10) ? "0" + milliseconds : milliseconds;

            display.innerHTML = hours + ':' + minutes + ':' + seconds + '<span class="ms">.' + milliseconds + '</span>';
        }

        // === تأثير حركة الأزرار بالكيبورد ===
        function animateButton(btn) {
            btn.style.transform = "scale(0.85)";
            setTimeout(() => btn.style.transform = "scale(1)", 150);
        }

        // === اختصارات الكيبورد (المسطرة وحرف R) ===
        document.addEventListener('keydown', function(event) {
            // المسطرة للتشغيل والإيقاف
            if (event.code === 'Space') {
                event.preventDefault(); 
                toggleStopwatch();
            }
            // حرف R للتصفير (سواء كابيتال أو سمول)
            if (event.key.toLowerCase() === 'r' || event.key.toLowerCase() === 'ث') {
                event.preventDefault();
                resetStopwatch();
            }
        });

        // === برمجة العدادات ===
        let scores = { mistakes: 0, prompts: 0 };
        function updateCounter(type, value) {
            scores[type] += value;
            if (scores[type] < 0) scores[type] = 0; 
            
            let el = document.getElementById(type);
            el.innerText = scores[type];
            
            // حركة النبض للرقم
            el.style.transform = "scale(1.4)";
            setTimeout(() => el.style.transform = "scale(1)", 150);
        }
    </script>
</body>
</html>
