<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أكاديمية السرد - لوحة التحكم الذكية</title>
    
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <div class="navbar">
        <div class="brand-logo" onclick="toggleSidebar()" title="عرض السجل">
            <span>السجل</span>
        </div>
        
        <div class="session-title-container">
            <input type="text" id="sessionTitleInput" class="top-session-input" oninput="handleTitleChange()" title="تغيير اسم الجلسة">
        </div>

        <div class="action-top-btns">
            <button class="btn-top" onclick="takeScreenshot()" style="border-color: var(--accent-gold); color: var(--accent-gold);">الحفظ كصورة</button>
        </div>
    </div>

    <div class="capture-area" id="captureArea">
        <div class="dashboard">
            <div class="card card-full" id="mainCard">
                <h2>المؤقت الزمني</h2>
                
                <div class="stopwatch-display" id="display">
                    00:00:00<span class="ms" id="ms">.00</span>
                </div>
                
                <div class="controls">
                    <button id="mainBtn" class="btn-circle play-state" onclick="toggleStopwatch()">
                        <span id="mainText">بدء</span>
                    </button>
                    
                    <button id="resetBtn" class="btn-circle btn-reset" onclick="resetStopwatch()">
                        <span>تصفير</span>
                    </button>
                </div>
            </div>

            <div class="card">
                <h2>الأخطاء</h2>
                <div class="counter-wrap">
                    <button class="btn-counter" onclick="updateCounter('mistakes', -1)">-</button>
                    <div class="counter-val val-red" id="mistakes">0</div>
                    <button class="btn-counter" onclick="updateCounter('mistakes', 1)">+</button>
                </div>
            </div>

            <div class="card">
                <h2>التنبيهات</h2>
                <div class="counter-wrap">
                    <button class="btn-counter" onclick="updateCounter('prompts', -1)">-</button>
                    <div class="counter-val val-cyan" id="prompts">0</div>
                    <button class="btn-counter" onclick="updateCounter('prompts', 1)">+</button>
                </div>
            </div>
        </div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>السجل</h3>
            <div class="header-actions">
                <button class="btn-new-session" onclick="createNewSession()">+ حلقة جديدة</button>
                <button class="close-sidebar" onclick="toggleSidebar()">&times;</button>
            </div>
        </div>
        <div class="sessions-list" id="sessionsList">
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
